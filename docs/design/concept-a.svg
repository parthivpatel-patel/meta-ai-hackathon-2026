<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title"><title id="title">Concept A: a continuous scientific notebook with chapter navigation</title><style>text{font-family:Arial,sans-serif;fill:#293533} .small{font-size:13px;fill:#52665f}.title{font-size:20px;font-weight:bold}.box{fill:#f3f6f4;stroke:#c5d3cd}.rule{stroke:#c5d3cd}.accent{fill:#12615b}.white{fill:white}</style><rect width="960" height="600" fill="white"/><text x="30" y="40" class="title">A. Scientific notebook</text><rect x="20" y="70" width="160" height="510" class="box"/><text x="36" y="103" class="small">Notebook index</text><text x="36" y="145" class="small">1. Observation</text><text x="36" y="185" class="small">2. Hypotheses</text><text x="36" y="225" class="small">3. Experiment 1</text><text x="36" y="265" class="small">4. Experiment 2</text><text x="36" y="305" class="small">5. Conclusion</text><text x="220" y="104" class="title">Pump investigation / research record</text><text x="220" y="145" class="small">Observation 01: pressure readings changed.</text><line x1="220" y1="170" x2="900" y2="170" class="rule"/><rect x="220" y="190" width="680" height="110" class="box"/><text x="242" y="218" class="small">Inline measurement figure</text><text x="220" y="338" class="title">Experiment 01: acquire reference readings</text><text x="220" y="374" class="small">Method, observations and numerical findings in sequence.</text><rect x="220" y="398" width="680" height="90" class="box"/><text x="240" y="430" class="small">Evidence and interpretation stay together in the document.</text><text x="220" y="535" class="small">Mobile: chapter picker above a continuous research record.</text></svg>