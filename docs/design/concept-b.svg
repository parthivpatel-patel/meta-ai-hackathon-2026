<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title"><title id="title">Concept B: horizontal guided stages, focused evidence area and contextual action guide</title><style>text{font-family:Arial,sans-serif;fill:#293533} .small{font-size:13px;fill:#52665f}.title{font-size:20px;font-weight:bold}.box{fill:#f3f6f4;stroke:#c5d3cd}.rule{stroke:#c5d3cd}.accent{fill:#12615b}.white{fill:white}</style><rect width="960" height="600" fill="white"/><text x="30" y="40" class="title">B. Guided investigation application</text><rect x="20" y="70" width="920" height="50" class="box"/><text x="36" y="101" class="small">FORGE    /    Pump investigation</text><text x="752" y="101" class="small">Change case</text><rect x="20" y="140" width="920" height="50" class="box"/><text x="40" y="171" class="small">Overview     Evidence     Possible causes     Tests     Results     Report</text><text x="40" y="235" class="title">Examine the evidence.</text><text x="40" y="268" class="small">One stage, one purpose and one next action.</text><rect x="40" y="300" width="590" height="220" class="box"/><text x="60" y="330" class="small">Evidence inspector</text><line x1="60" y1="355" x2="600" y2="355" class="rule"/><text x="60" y="388" class="small">Temperature     Vibration     Pressure</text><text x="60" y="445" class="small">One readable instrument, with source details on demand.</text><rect x="675" y="220" width="245" height="300" class="box"/><text x="695" y="253" class="title">Your next step</text><text x="695" y="296" class="small">Why this stage matters</text><rect x="695" y="335" width="205" height="44" class="accent"/><text x="710" y="363" class="white">Continue investigation</text><text x="695" y="415" class="small">Current verification state</text><text x="40" y="566" class="small">Mobile: stage selector and compact action bar above the focused task.</text></svg>