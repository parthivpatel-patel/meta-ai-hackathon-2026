# Local rehearsal only. This does not provision public hosting or TLS.
services:
  forge:
    image: forge:phase4
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:7862:7860"
    environment:
      FORGE_DEMO_MODE: public
      FORGE_DEMO_ALLOWED_HOSTS: '${FORGE_DEMO_ALLOWED_HOSTS:-["localhost","127.0.0.1","::1"]}'
      FORGE_DEMO_DB_PATH: /data/investigations.sqlite3
      FORGE_PROVIDER: mock
      FORGE_INFERENCE_ENABLED: "false"
      FORGE_INFERENCE_REQUEST_BUDGET: "0"
      PORT: "7860"
    volumes:
      - forge-state:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 512m
    cpus: 1
    stop_grace_period: 20s
volumes:
  forge-state:
