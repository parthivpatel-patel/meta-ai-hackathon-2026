name: FORGE checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
      - run: uv sync --project backend --frozen --python 3.12
      - run: uvx --from ruff==0.17.3 ruff check --isolated --select F,I,BLE001,RUF007 backend/forge
      - run: cd backend && uv run --frozen pytest -q
      - run: cd backend && uv run --frozen python -m forge.industrial.evaluate --output /tmp/forge-industrial-evaluation.json
      - run: cd backend && uv run --frozen python -m forge.industrial.meta_evaluate --output /tmp/forge-meta-fixture-evaluation.json
      - run: cd backend && uv run --frozen python -m forge.submission.smoke
      - run: cd backend && uv run --frozen python -m forge.submission.model_evaluation
      - run: cd backend && uv run --frozen python -m forge.submission.models
      - run: uv run --project backend --frozen python scripts/build-submission-evidence.py
      - run: git diff --exit-code -- docs/submission/
      - run: cd backend && uv run --frozen python -m forge.evaluate --output /tmp/forge-evaluation.json
      - run: cd backend && uv run --frozen python -m forge.phase2.evaluate --output /tmp/forge-phase2-evaluation.json
      - run: cd backend && uv run --frozen python -m forge.phase3.evaluate --output /tmp/forge-phase3-evaluation.json
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run check:tests && npm test && npm run build
        working-directory: frontend

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t forge-ci .
      - name: Start restricted public image
        run: >-
          docker run -d --name forge-ci --read-only --tmpfs /tmp:rw,nosuid,nodev,size=64m
          --memory=512m --cpus=1 --cap-drop=ALL --security-opt=no-new-privileges
          -e FORGE_DEMO_DB_PATH=/tmp/investigations.sqlite3
          -e FORGE_DEMO_STORAGE_EPHEMERAL=true
          -e OPENBLAS_NUM_THREADS=1 -e OMP_NUM_THREADS=1 forge-ci
      - name: Verify readiness and public security boundaries
        run: python scripts/check-container.py forge-ci --image forge-ci
      - name: Clean up local test image process
        if: always()
        run: docker rm -f forge-ci || true
